# The shape k3s v1.31 writes with --write-kubeconfig (client-go's
# clientcmd.WriteToFile, which still writes preferences: {}), with short
# stand-ins for the base64 certificate data.
apiVersion: v1
clusters:
- cluster:
    certificate-authority-data: Q0EgUEVNCg==
    server: https://127.0.0.1:6443
  name: default
contexts:
- context:
    cluster: default
    user: default
  name: default
current-context: default
kind: Config
preferences: {}
users:
- name: default
  user:
    client-certificate-data: Q0VSVCBQRU0K
    client-key-data: S0VZIFBFTQo=
