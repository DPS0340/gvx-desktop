name: Release

# A tag vX.Y.Z releases the app. For Apple silicon Macs ggui build makes
# gvx Desktop.app and its disk image, the image becomes the tag's GitHub
# release, and a cask for it goes to the Homebrew tap ironpark/homebrew-tap
# (release/cask.sh writes it), so that
#
#	brew install --cask ironpark/tap/gvx-desktop
#
# installs it. gvx itself is released for Apple silicon only, hence no Intel
# build for the Mac. For Windows, on Intel and AMD and on Arm, ggui build
# cross-builds GVX Desktop.exe, which is added to the release in a zip.
#
# Run by hand with a tag that is already released, the workflow builds the
# Windows programs for it again and puts them in its release, leaving the
# disk image and the cask as they are.
#
# Secrets, all optional but the first:
#
#	TAP_GITHUB_TOKEN       a token that may write to ironpark/homebrew-tap
#	GGUI_P12_BASE64        a Developer ID Application certificate and key,
#	GGUI_P12_PASSWORD      as base64 of the .p12, and its password
#	NOTARY_API_KEY_JSON    an App Store Connect API key to notarize with:
#	                       {"issuer_id", "key_id", "private_key"}
#
# Without the certificate the app is signed ad hoc, and the cask takes the
# download's quarantine off it with xattr, so that Gatekeeper lets it open.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: A released tag to build the Windows programs for again, such as v0.1.0
        required: true

permissions:
  contents: write

# One release at a time, and never one cut off half way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          configured="$(sed -n 's/^version = "\(.*\)"$/\1/p' ggui.toml)"
          if [ "$version" != "$configured" ]; then
            echo "::error::the tag says $version, ggui.toml says $configured"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$(sed -n 's/^name = "\(.*\)"$/\1/p' ggui.toml)" >> "$GITHUB_OUTPUT"
      - name: Test
        run: go test -short ./...
      - name: Install the ggui command
        run: go install github.com/ironpark/ggui/cmd/ggui@latest
      - name: Build
        id: build
        env:
          GGUI_P12_BASE64: ${{ secrets.GGUI_P12_BASE64 }}
          GGUI_P12_PASSWORD: ${{ secrets.GGUI_P12_PASSWORD }}
          NOTARY_API_KEY_JSON: ${{ secrets.NOTARY_API_KEY_JSON }}
          VERSION: ${{ steps.version.outputs.version }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          signing=adhoc
          set -- --dmg --ldflags "-X main.version=$VERSION"
          if [ -n "$GGUI_P12_BASE64" ]; then
            signing=identity
            set -- "$@" --identity "Developer ID Application"
            if [ -n "$NOTARY_API_KEY_JSON" ]; then
              printf '%s' "$NOTARY_API_KEY_JSON" > "$RUNNER_TEMP/notary.json"
              set -- "$@" --notarize --api-key-file "$RUNNER_TEMP/notary.json"
            fi
          fi
          ggui build "$@"
          release/check-bundle.sh
          dmg="gvx-desktop-$VERSION-macos-arm64.dmg"
          mv "build/$NAME.dmg" "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          echo "signing=$signing" >> "$GITHUB_OUTPUT"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$dmg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DMG: ${{ steps.build.outputs.dmg }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$DMG" "$DMG.sha256" \
            --title "${{ steps.version.outputs.name }} $VERSION" \
            --generate-notes \
            --notes "On an Apple silicon Mac (macOS 13 or later), install with \`brew install --cask ironpark/tap/gvx-desktop\`, or open the disk image and drag the app to Applications. On Windows, unzip the program for your PC: amd64 for Intel and AMD, arm64 for Arm."
      - name: Update the Homebrew tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          SIGNING: ${{ steps.build.outputs.signing }}
        run: |
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "::error::TAP_GITHUB_TOKEN is not set; the release is out, the tap is not updated"
            exit 1
          fi
          release/cask.sh "$VERSION" "$SHA256" "$SIGNING" > gvx-desktop.rb
          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/ironpark/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp gvx-desktop.rb tap/Casks/gvx-desktop.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/gvx-desktop.rb
          git diff --cached --quiet && { echo "the cask is unchanged"; exit 0; }
          git commit -m "Update gvx-desktop to $VERSION"
          git push

  # The Windows programs join the release the Mac job made, or, run by
  # hand, the one the tag already has.
  windows:
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install the ggui command
        run: go install github.com/ironpark/ggui/cmd/ggui@latest
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: |
          version="${TAG#v}"
          name="$(sed -n 's/^name = "\(.*\)"$/\1/p' ggui.toml)"
          for arch in amd64 arm64; do
            GOARCH="$arch" ggui build --target windows --out "build/$arch" --ldflags "-X main.version=$version"
            zip="gvx-desktop-$version-windows-$arch.zip"
            (cd "build/$arch" && zip -q "../../$zip" "$name.exe")
            sha256sum "$zip" > "$zip.sha256"
          done
          ls -l ./*.zip
      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" ./*.zip ./*.zip.sha256 --clobber
